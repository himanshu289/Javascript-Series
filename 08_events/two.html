<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Projects with Async JS</title>
</head>
<body>
    <h2>Himanshu Harsora</h2>
    <button id="stop">Stop</button>
    
</body>
<script>
    const sayHimanshu = function() {
        console.log("Himanshu Harsora");
    }
    
    const changeText = function() {
        document.querySelector('h2').innerHTML = "Kese Ho Bhaiyaji" 
    }
    
    const changeMe = setTimeout(changeText ,2000)

    document.querySelector('#stop').addEventListener('click', function() {
        clearTimeout(changeMe)
        console.log("STOPPED");
    })
      


</script>
</html>
