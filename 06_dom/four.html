<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Chai aur Code</title>
</head>

<body style="background-color: #212121; color: white;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
    
</body>

<script>
    function addLanguage (langName) {

        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }

    addLanguage("python")
    addLanguage("typescript")

    function addOptiLanguage (langName) {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName));  // ==> Better Optimized approach than above approach cuz in this method we do not have to traverse whole tree to add the name in the list , it directly adds the new text node.
        document.querySelector('.language').appendChild(li);
    }
    
    addOptiLanguage("golang")
    addOptiLanguage("C++")


    // Edit 

    const secondLang = document.querySelector("li:nth-child(2)");
    // secondLang.innerHTML = "Mojo"
    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    secondLang.replaceWith(newli)

    // Edit - Method 2

    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = "<li>Typescript</li>"

    // Remove

    const lastLang = document.querySelector("li:last-child")
    lastLang.remove()



</script>

</html>
