<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>BMI Calculator</title>

</head>

<body>
    <h3>BMI Calculator</h3>

    <form>

        <div class="data">

            <div class="heightAndwight">
                <span>Height in CM : </span>
                <input class="inputClass" type="text" id="height" placeholder="Enter Height in CM">
            </div>

            <div class="heightAndwight">
                <span>Weight in KG : </span>
                <input class="inputClass" type="text" id="weight" placeholder="Enter Weight in KG">
            </div>

        </div>

        <button class="calculate">Calculate</button>

        <div class="results"></div>

        <div class="guide">
            <h4>BMI Weight Guide</h4>
            <p id="under">Under Weight = Less than 18.6</p>
            <p id="normal">Normal Range = 18.6 and 24.9</p>
            <p id="over">Overweight = Greater than 24.9</p>
        </div>
        
    </form>

</body>

<script src="BMIcalculator.js"></script>

</html>
